name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtbase'

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a1f18b1b1146e8b1a3d58f27e1b7f3d8a3e5c5f5'
        runVcpkgInstall: false

    - name: Install dependencies via vcpkg
      run: |
        vcpkg integrate install
        vcpkg install openssl:x64-windows curl:x64-windows nlohmann-json:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Deploy Qt DLLs
      shell: powershell
      run: |
        ${{ env.Qt6_DIR }}/bin/windeployqt.exe --release build/Release/EsetKeys.exe
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "build/Release/" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsetKeys-Windows-Release
        path: build/Release/