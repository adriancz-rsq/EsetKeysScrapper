name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a1f18b1b1146e8b1a3d58f27e1b7f3d8a3e5c5f5'
        runVcpkgInstall: false

    - name: Install all dependencies via vcpkg
      run: |
        vcpkg integrate install
        vcpkg install qt6-base:x64-windows openssl:x64-windows curl:x64-windows nlohmann-json:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Deploy Qt DLLs
      shell: powershell
      run: |
        # Znajdź ścieżkę do windeployqt
        $windeployqt = Get-ChildItem -Path "C:/vcpkg/installed/x64-windows/tools" -Recurse -Filter "windeployqt.exe" | Select-Object -First 1 -ExpandProperty FullName
        if ($windeployqt) {
          & $windeployqt --release build/Release/EsetKeys.exe
        }
        Copy-Item -Path "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination "build/Release/" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsetKeys-Windows-Release
        path: build/Release/